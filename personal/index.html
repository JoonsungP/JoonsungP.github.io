<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Joonsung Park — 개인 사이트">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,340;9..144,440;9..144,560&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<title>Personal · Joonsung Park</title>
<style>
  :root{
    --paper:#FCFBF8; --surface:#FFFFFF; --ink:#17181A; --muted:#6A6E73;
    --line:#E8E4DC; --faint:#F1EEE7; --accent:#2B50E6;
    --maxw:720px;
    --serif:"Fraunces","Noto Sans KR",Georgia,serif;
    --sans:"IBM Plex Sans","Noto Sans KR",system-ui,-apple-system,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#0F1113; --surface:#16181B; --ink:#ECEEF0; --muted:#969CA3;
      --line:#282C31; --faint:#1B1E22; --accent:#7C90FF;
    }
  }
  :root[data-theme="dark"]{
    --paper:#0F1113; --surface:#16181B; --ink:#ECEEF0; --muted:#969CA3;
    --line:#282C31; --faint:#1B1E22; --accent:#7C90FF;
  }

  *{box-sizing:border-box}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:var(--sans); font-size:15.5px; line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit}
  .wrap{max-width:var(--maxw); margin:0 auto; padding-inline:22px}

  .bar{position:sticky; top:0; z-index:10;
    background:color-mix(in srgb,var(--paper) 86%,transparent);
    backdrop-filter:saturate(1.2) blur(8px); border-bottom:1px solid var(--line)}
  .bar .wrap{display:flex; align-items:center; gap:16px; height:54px}
  .bar .me{font-family:var(--serif); font-weight:560; font-size:16px; letter-spacing:.01em}
  .bar nav{margin-left:auto; display:flex; gap:20px}
  .bar nav a{text-decoration:none; color:var(--muted); font-size:13.5px; font-weight:500}
  .bar nav a:hover{color:var(--ink)}
  @media (max-width:540px){ .bar nav{display:none} }

  main{padding-block:8px 40px}
  section{padding-block:34px; border-top:1px solid var(--line)}
  section:first-of-type{border-top:0}
  .eyebrow{font-size:11.5px; font-weight:600; letter-spacing:.16em; text-transform:uppercase;
    color:var(--accent); margin:0 0 16px}

  .hero{padding-block:52px 30px; border:0}
  .hero h1{font-family:var(--serif); font-weight:340; font-size:clamp(40px,9vw,66px);
    line-height:1.04; letter-spacing:-.01em; margin:0; text-wrap:balance}
  .hero .role{font-size:18px; color:var(--ink); margin:16px 0 0; font-weight:500}
  .hero .tag{font-size:16px; color:var(--muted); margin:8px 0 0; max-width:52ch}
  .links{display:flex; flex-wrap:wrap; gap:9px; margin-top:24px}
  .links a{display:inline-flex; align-items:center; gap:7px; text-decoration:none;
    font-size:13.5px; font-weight:500; color:var(--ink);
    border:1px solid var(--line); border-radius:999px; padding:7px 14px; background:var(--surface)}
  .links a:hover{border-color:var(--accent); color:var(--accent)}
  .links svg{width:15px; height:15px; display:block}

  .about p{margin:0; font-size:16.5px; line-height:1.7; max-width:60ch}

  .entry{display:grid; grid-template-columns:1fr auto; gap:4px 24px; padding:16px 0; border-top:1px solid var(--faint)}
  .entry:first-of-type{border-top:0; padding-top:2px}
  .entry .role{font-weight:600; font-size:16px}
  .entry .org{color:var(--muted); font-size:14.5px; margin-top:1px}
  .entry .when{color:var(--muted); font-size:13px; font-variant-numeric:tabular-nums; white-space:nowrap; text-align:right; padding-top:2px}
  .entry ul{grid-column:1 / -1; margin:9px 0 0; padding-left:18px; color:var(--muted); font-size:14.5px}
  .entry ul li{margin:3px 0}
  @media (max-width:540px){
    .entry{grid-template-columns:1fr}
    .entry .when{text-align:left; padding-top:2px}
  }

  footer{border-top:1px solid var(--line); padding-block:26px 40px; color:var(--muted); font-size:13px;
    display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap}
  footer a{color:var(--muted)}
  ::selection{background:color-mix(in srgb,var(--accent) 22%,transparent)}
  html{scroll-behavior:smooth}
  section{scroll-margin-top:64px}
</style>
<style>img{max-width:100%;height:auto}</style>

<style>
  .list-hero{padding-block:52px 14px;border:0}
  .list-hero h1{font-family:var(--serif);font-weight:340;font-size:clamp(32px,7vw,48px);line-height:1.05;margin:.15em 0 0}
  .posts{padding-top:8px}
  .post{display:flex;gap:16px;justify-content:space-between;align-items:baseline;text-decoration:none;padding:18px 0;border-top:1px solid var(--faint)}
  .post:first-of-type{border-top:0}
  .post-title{font-weight:600;font-size:17px}
  .post:hover .post-title{color:var(--accent)}
  .post-desc{color:var(--muted);font-size:14.5px;margin-top:3px;max-width:52ch}
  .post-date{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap;padding-top:3px}
  .bar nav a[aria-current]{color:var(--ink)}
</style></head>
<body>

<header class="bar">
  <div class="wrap">
    <a class="me" href="../" style="text-decoration:none">Joonsung Park</a>
    <nav>
      <a href="../#about">About</a>
      <a href="../#education">Education</a>
      <a href="../#publication">Publication</a>
      <a href="./" aria-current="page">Personal</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="list-hero">
    <p class="eyebrow">Personal</p>
    <h1>Writing &amp; Notes</h1>
    <p class="tag">여행, 기록, 그리고 개인적인 글들.</p>
  </section>

  <section class="posts" style="border-top:0">
    <a class="post" href="fukuoka/">
      <div>
        <div class="post-title">후쿠오카 3박4일 여행 일정</div>
        <div class="post-desc">도진마치 숙소를 축으로 짠 동선 지도와 시간표. 일차별 지도 위에 방문 순서를 표시했습니다.</div>
      </div>
      <div class="post-date">2026 · 09</div>
    </a>
  </section>
</main>

<footer class="wrap">
  <span>© <span id="yr"></span> Joonsung Park</span>
  <span>Seoul, Korea</span>
</footer>
<script>document.getElementById('yr').textContent=new Date().getFullYear();</script>

</body>
</html>
